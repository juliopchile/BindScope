# Optional Playwright smoke — independent of Pages deploy so a flake never blocks publish.

name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install chromium --with-deps

      - name: Build
        working-directory: app
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Smoke
        working-directory: app
        env:
          CI: true
        run: npm run test:e2e
