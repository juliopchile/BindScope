// Sample Source-engine CFG (CS2-style). Comments and non-bind commands ignored.
// Unknown keys (e.g. KP_END) are skipped after normalization.

unbindall
bind "w" "+forward"
bind "a" "+moveleft"
bind "s" "+back"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "e" "+use"
bind "g" "drop"
bind "q" "lastinv"
bind "1" "slot1"
bind "2" "slot2"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "KP_END" "buy ak47" // unknown → skipped
echo "autoexec loaded"
